# Toute la suite de tests sur les trois systèmes (Mac, Windows, Linux), à chaque envoi sur main.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"
  TZ: Europe/Paris
  TRIPCOMPTA_NO_UPDATE_CHECK: "1"

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Navigateur (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Navigateur (Mac, Windows)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Tests
        run: python -m pytest -q

# Publier une version de Trip Compta.
#
#   git tag -a v1.2.0 -m "Les nouveautés, une par ligne"     (v1.2.0-beta1 : version d'essai, non proposée)
#   git push origin v1.2.0
#
# 1. Les tests (rien n'est publié s'ils échouent) ; 2. les applications (Windows : l'installeur) ; 3. la Release GitHub, avec
# SHA256SUMS.txt et sa signature SHA256SUMS.txt.sig (secret TRIPCOMPTA_CLE_SIGNATURE, voir docs/PUBLIER.md) : les
# applications installées n'acceptent qu'une mise à jour dont les empreintes sont signées. Elles proposent ensuite la
# mise à jour toutes seules. La Release est créée en brouillon, complétée, puis publiée d'un coup : compatible avec
# les « publications immuables » de GitHub (réglage du dépôt, voir docs/PUBLIER.md).
name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  PYTHON_ORG_VERSION: "3.14.10"             # Mac Intel : Python de python.org (voir plus bas)
  TZ: Europe/Paris

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: L'étiquette correspond à la version du code
        run: |
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, ".")
          from compta import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          m = re.match(r"^v(\d+\.\d+\.\d+)(-(alpha|beta|rc)\d*)?$", tag)
          if not m:
              sys.exit(f"Étiquette illisible : {tag} (attendu v1.2.0 ou v1.2.0-beta1)")
          if m.group(1) != __version__:
              sys.exit(f"L'étiquette {tag} ne correspond pas à compta/__init__.py ({__version__})")
          print(f"Version {tag[1:]}")
          PY
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: "La clé de signature des mises à jour est là, et c'est la bonne (sinon rien n'est fabriqué)"
        env:
          TRIPCOMPTA_CLE_SIGNATURE: ${{ secrets.TRIPCOMPTA_CLE_SIGNATURE }}
        run: python build_tools/signer_empreintes.py cle
      - name: Tests
        run: python -m pytest -q

  build:
    name: Fabriquer (${{ matrix.asset }})
    needs: tests
    runs-on: ${{ matrix.os }}
    env:
      # Mac : signature Developer ID et notarisation, seulement si les secrets existent (voir docs/SIGNATURE.md) ;
      # sinon signature « ad hoc », comme avant
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            asset: TripCompta-mac-arm64.zip
            exe: dist/TripCompta.app/Contents/MacOS/TripCompta
          - os: macos-15-intel
            asset: TripCompta-mac-intel.zip
            exe: dist/TripCompta.app/Contents/MacOS/TripCompta
          - os: windows-latest
            asset: TripCompta-windows-setup.exe
            exe: dist/TripCompta/TripCompta.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'macos-15-intel'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      # Mac Intel : le Python de GitHub y est lié à l'OpenSSL de Homebrew, fabriqué pour macOS 15 (l'app ne s'ouvrirait
      # pas sur un Mac Intel en macOS 13 ou 14). Celui de python.org embarque son propre OpenSSL (macOS 11 et plus).
      - name: "Python de python.org (Mac Intel)"
        if: matrix.os == 'macos-15-intel'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" "https://www.python.org/ftp/python/${PYTHON_ORG_VERSION}/python-${PYTHON_ORG_VERSION}-macos11.pkg"
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/${PYTHON_VERSION}/bin/python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -c "import ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION)"
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest httpx
      - name: "Sa propre fenêtre (Mac, Windows) : pywebview, et sous Windows pythonnet + WebView2"
        shell: bash
        run: |
          python -c "import webview; from compta import fenetre; assert fenetre.available(); print('pywebview', webview.__name__, 'OK')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import clr; print('pythonnet OK')"
            reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv || echo "WebView2 : non trouvé dans le registre (normalement fourni par Windows 10/11)"
          fi
      - name: Tester le script de mise à jour sur ce système
        run: python -m pytest -q tests/test_update_script.py
      - name: Certificat Developer ID (Mac, si fourni)
        if: runner.os == 'macOS' && env.APPLE_SIGN_IDENTITY != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KC_PW="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" signature.keychain
          security set-keychain-settings -lut 21600 signature.keychain
          security unlock-keychain -p "$KC_PW" signature.keychain
          security import "$RUNNER_TEMP/cert.p12" -k signature.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" signature.keychain
          security list-keychains -d user -s signature.keychain $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning signature.keychain
      - name: Fabriquer l'application
        env:
          TRIPCOMPTA_RELEASE: ${{ github.ref_name }}
        run: python build_tools/build.py
      - name: "macOS minimal : pas plus récent que macOS 13 (sinon les Mac plus anciens ne l'ouvriraient plus)"
        if: runner.os == 'macOS'
        run: python build_tools/macos_minimum.py --max 13.0 dist/TripCompta.app
      - name: Vérifier qu'elle démarre
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          python build_tools/smoke.py "${{ matrix.exe }}" "$V"
      - name: "La vraie fenêtre (Mac : WebKit ; Windows : WebView2 + .NET), en mode discret"
        shell: bash
        run: |
          V="$(python -c 'from compta import __version__; print(__version__)')-dev"
          if [ -n "${TRIPCOMPTA_RELEASE:-}" ] || [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          python build_tools/smoke.py "${{ matrix.exe }}" "$V" --fenetre
      - name: Notariser (Mac, si fourni)
        if: runner.os == 'macOS'
        run: python build_tools/signer_mac.py notariser dist/TripCompta.app
      - name: Emballer (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/TripCompta.app" "${{ matrix.asset }}"
      - name: "Emballer (Windows) : l'installeur (Inno Setup), essayé pour de vrai"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $V = "${env:GITHUB_REF_NAME}".TrimStart("v")
          python build_tools/installeur_windows.py $V
          python build_tools/essai_installeur.py dist/TripCompta-windows-setup.exe $V
          Copy-Item dist/TripCompta-windows-setup.exe "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publier
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Empreintes signées
        env:
          TRIPCOMPTA_CLE_SIGNATURE: ${{ secrets.TRIPCOMPTA_CLE_SIGNATURE }}
        run: |
          test "$(ls assets/TripCompta-* | wc -l)" -eq 3      # Mac ×2, Windows (installeur)
          grep '^cryptography' requirements.txt > "$RUNNER_TEMP/signature.txt"      # la même version que l'application
          python -m pip install -r "$RUNNER_TEMP/signature.txt"
          python build_tools/signer_empreintes.py signer assets "${GITHUB_REF_NAME#v}"
          cat assets/SHA256SUMS.txt
          test "$(ls assets | wc -l)" -eq 5                   # + SHA256SUMS.txt et SHA256SUMS.txt.sig
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP/,$d' > notes.md
          fi
          if [ ! -s notes.md ]; then echo "Nouvelle version de Trip Compta." > notes.md; fi
          printf '\nPremière installation : https://github.com/%s/blob/main/INSTALLER.md\n' "$GITHUB_REPOSITORY" >> notes.md
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          # en brouillon d'abord : tous les fichiers sont là avant que la version soit visible (et figée, si les
          # publications immuables sont activées) ; puis publiée d'un coup
          gh release create "$TAG" assets/* --verify-tag --draft --title "Trip Compta ${TAG#v}" --notes-file notes.md $PRE
          test "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 5
          gh release edit "$TAG" --draft=false

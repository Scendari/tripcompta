# Fabrique l'application pour Mac (Apple Silicon, Intel) et Windows et vérifie qu'elle démarre (y compris la protection par mot de
# passe : chiffrement, redémarrage, déverrouillage), SANS rien publier. Les versions publiées : release.yml.
name: Fabrication

on:
  push:
    branches: [main]
    paths:
      - "build_tools/**"
      - ".github/workflows/fabrication.yml"
      - "requirements*.txt"
      - "constraints.txt"
      - "compta/crypto.py"
      - "compta/coffre.py"
      - "compta/dossier.py"
      - "compta/updater.py"
      - "run.py"
      - ".github/workflows/fabrication.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"
  PYTHON_ORG_VERSION: "3.14.10"             # Mac Intel : Python de python.org (voir plus bas)
  TZ: Europe/Paris

jobs:
  build:
    name: Fabriquer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            exe: dist/TripCompta.app/Contents/MacOS/TripCompta
          - os: macos-15-intel
            exe: dist/TripCompta.app/Contents/MacOS/TripCompta
          - os: windows-latest
            exe: dist/TripCompta/TripCompta.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.os != 'macos-15-intel'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      # Mac Intel : le Python de GitHub y est lié à l'OpenSSL de Homebrew, fabriqué pour macOS 15 (l'app ne s'ouvrirait
      # pas sur un Mac Intel en macOS 13 ou 14). Celui de python.org embarque son propre OpenSSL (macOS 11 et plus).
      - name: "Python de python.org (Mac Intel)"
        if: matrix.os == 'macos-15-intel'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" "https://www.python.org/ftp/python/${PYTHON_ORG_VERSION}/python-${PYTHON_ORG_VERSION}-macos11.pkg"
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/${PYTHON_VERSION}/bin/python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -c "import ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION)"
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: "Sa propre fenêtre (Mac, Windows) : pywebview, et sous Windows pythonnet + WebView2"
        shell: bash
        run: |
          python -c "import webview; from compta import fenetre; assert fenetre.available(); print('pywebview', webview.__name__, 'OK')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import clr; print('pythonnet OK')"
            reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv || echo "WebView2 : non trouvé dans le registre (normalement fourni par Windows 10/11)"
          fi
      - name: Fabriquer l'application
        run: python build_tools/build.py
      - name: "macOS minimal : pas plus récent que macOS 13 (sinon les Mac plus anciens ne l'ouvriraient plus)"
        if: runner.os == 'macOS'
        run: python build_tools/macos_minimum.py --max 13.0 dist/TripCompta.app
      - name: Vérifier qu'elle démarre (et la protection par mot de passe)
        shell: bash
        run: |
          V="$(python -c 'from compta import __version__; print(__version__)')-dev"
          python build_tools/smoke.py "${{ matrix.exe }}" "$V"
      - name: "La vraie fenêtre (Mac : WebKit ; Windows : WebView2 + .NET), en mode discret"
        shell: bash
        run: |
          V="$(python -c 'from compta import __version__; print(__version__)')-dev"
          if [ -n "${TRIPCOMPTA_RELEASE:-}" ] || [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          python build_tools/smoke.py "${{ matrix.exe }}" "$V" --fenetre
      - name: "Installeur Windows (Inno Setup) : installation, mise à jour silencieuse, désinstallation, pour de vrai"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $V = "$(python -c 'from compta import __version__; print(__version__)')-dev"
          python build_tools/installeur_windows.py $V
          python build_tools/essai_installeur.py dist/TripCompta-windows-setup.exe $V

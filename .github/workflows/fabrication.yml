# Fabrique l'application sur les trois systèmes et vérifie qu'elle démarre (y compris la protection par mot de
# passe : chiffrement, redémarrage, déverrouillage), SANS rien publier. Les versions publiées : release.yml.
name: Fabrication

on:
  push:
    branches: [main]
    paths:
      - "build_tools/**"
      - "requirements*.txt"
      - "compta/crypto.py"
      - "compta/coffre.py"
      - "compta/dossier.py"
      - "compta/updater.py"
      - "run.py"
      - ".github/workflows/fabrication.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"
  TZ: Europe/Paris

jobs:
  build:
    name: Fabriquer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            exe: dist/TripCompta.app/Contents/MacOS/TripCompta
          - os: windows-latest
            exe: dist/TripCompta/TripCompta.exe
          - os: ubuntu-22.04
            exe: dist/TripCompta/TripCompta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: "Sa propre fenêtre (Mac, Windows) : pywebview, et sous Windows pythonnet + WebView2"
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -c "import webview; from compta import fenetre; assert fenetre.available(); print('pywebview', webview.__name__, 'OK')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import clr; print('pythonnet OK')"
            reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv || echo "WebView2 : non trouvé dans le registre (normalement fourni par Windows 10/11)"
          fi
      - name: Fabriquer l'application
        run: python build_tools/build.py
      - name: Vérifier qu'elle démarre (et la protection par mot de passe)
        shell: bash
        run: |
          V="$(python -c 'from compta import __version__; print(__version__)')-dev"
          python build_tools/smoke.py "${{ matrix.exe }}" "$V"
      - name: "La vraie fenêtre (Mac : WebKit ; Windows : WebView2 + .NET), en mode discret"
        if: runner.os != 'Linux'
        shell: bash
        run: |
          V="$(python -c 'from compta import __version__; print(__version__)')-dev"
          if [ -n "${TRIPCOMPTA_RELEASE:-}" ] || [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          python build_tools/smoke.py "${{ matrix.exe }}" "$V" --fenetre
      - name: "Installeur Windows (Inno Setup) : installation, mise à jour silencieuse, désinstallation, pour de vrai"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $V = "$(python -c 'from compta import __version__; print(__version__)')-dev"
          python build_tools/installeur_windows.py $V
          python build_tools/essai_installeur.py dist/TripCompta-windows-setup.exe $V

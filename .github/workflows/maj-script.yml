# Teste le script de mise à jour (remplacer.sh / remplacer.ps1) sur les trois systèmes, à chaque modification.
name: Script de mise à jour

on:
  push:
    branches: [main]
    paths:
      - "compta/scripts/**"
      - "tests/test_update_script.py"
      - ".github/workflows/maj-script.yml"
  workflow_dispatch:

jobs:
  script:
    name: Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_update_script.py
